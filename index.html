<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T9 Phone Word Finder</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .key-btn {
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .key-btn:active { transform: scale(0.95); }
</style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

<div class="max-w-3xl mx-auto p-4">
  <h1 class="text-3xl font-bold text-center text-cyan-400 mb-1">T9 Phone Word Finder</h1>
  <p class="text-center text-gray-400 mb-5 text-sm">Click digits to find all English words that can be spelled with those keys</p>

  <div class="grid md:grid-cols-2 gap-5">
    <!-- Keypad & Input -->
    <div>
      <!-- Display -->
      <div class="bg-gray-800 rounded-xl p-4 mb-4">
        <div class="flex items-center gap-2 mb-2">
          <div id="digitDisplay"
            class="flex-1 bg-gray-700 rounded-lg px-4 py-3 text-2xl font-mono tracking-widest text-cyan-300 min-h-[3rem]"
            aria-label="Entered digits" aria-live="polite">
          </div>
          <button onclick="backspace()"
            class="bg-red-800 hover:bg-red-700 rounded-lg px-3 py-2 text-xl key-btn"
            aria-label="Backspace — remove last digit">⌫</button>
          <button onclick="clearAll()"
            class="bg-gray-600 hover:bg-gray-500 rounded-lg px-3 py-2 text-sm key-btn"
            aria-label="Clear all digits">CLR</button>
        </div>
        <div class="text-xs text-gray-400">
          Letters: <span id="lettersDisplay" class="text-gray-200 font-mono"></span>
        </div>
        <div class="text-sm mt-1">
          <span id="matchCount" class="text-cyan-300 font-bold">0</span> words found
        </div>
      </div>

      <!-- Keypad -->
      <div class="grid grid-cols-3 gap-2">
        <!-- Row 1 -->
        <button onclick="pressKey(2)" class="key-btn bg-gray-700 hover:bg-gray-600 active:bg-gray-500 rounded-xl py-4 flex flex-col items-center transition" aria-label="Key 2: ABC">
          <span class="text-2xl font-bold">2</span>
          <span class="text-xs text-gray-400">ABC</span>
        </button>
        <button onclick="pressKey(3)" class="key-btn bg-gray-700 hover:bg-gray-600 active:bg-gray-500 rounded-xl py-4 flex flex-col items-center transition" aria-label="Key 3: DEF">
          <span class="text-2xl font-bold">3</span>
          <span class="text-xs text-gray-400">DEF</span>
        </button>
        <button onclick="pressKey(4)" class="key-btn bg-gray-700 hover:bg-gray-600 active:bg-gray-500 rounded-xl py-4 flex flex-col items-center transition" aria-label="Key 4: GHI">
          <span class="text-2xl font-bold">4</span>
          <span class="text-xs text-gray-400">GHI</span>
        </button>
        <!-- Row 2 -->
        <button onclick="pressKey(5)" class="key-btn bg-gray-700 hover:bg-gray-600 active:bg-gray-500 rounded-xl py-4 flex flex-col items-center transition" aria-label="Key 5: JKL">
          <span class="text-2xl font-bold">5</span>
          <span class="text-xs text-gray-400">JKL</span>
        </button>
        <button onclick="pressKey(6)" class="key-btn bg-gray-700 hover:bg-gray-600 active:bg-gray-500 rounded-xl py-4 flex flex-col items-center transition" aria-label="Key 6: MNO">
          <span class="text-2xl font-bold">6</span>
          <span class="text-xs text-gray-400">MNO</span>
        </button>
        <button onclick="pressKey(7)" class="key-btn bg-gray-700 hover:bg-gray-600 active:bg-gray-500 rounded-xl py-4 flex flex-col items-center transition" aria-label="Key 7: PQRS">
          <span class="text-2xl font-bold">7</span>
          <span class="text-xs text-gray-400">PQRS</span>
        </button>
        <!-- Row 3 -->
        <button onclick="pressKey(8)" class="key-btn bg-gray-700 hover:bg-gray-600 active:bg-gray-500 rounded-xl py-4 flex flex-col items-center transition" aria-label="Key 8: TUV">
          <span class="text-2xl font-bold">8</span>
          <span class="text-xs text-gray-400">TUV</span>
        </button>
        <button onclick="pressKey(9)" class="key-btn bg-gray-700 hover:bg-gray-600 active:bg-gray-500 rounded-xl py-4 flex flex-col items-center transition" aria-label="Key 9: WXYZ">
          <span class="text-2xl font-bold">9</span>
          <span class="text-xs text-gray-400">WXYZ</span>
        </button>
        <button onclick="pressKey(0)" class="key-btn bg-gray-600 hover:bg-gray-500 active:bg-gray-400 rounded-xl py-4 flex flex-col items-center transition opacity-50 cursor-not-allowed" disabled aria-label="Key 0: space (not used)">
          <span class="text-2xl font-bold">0</span>
          <span class="text-xs text-gray-500">—</span>
        </button>
      </div>

      <div class="mt-3 text-xs text-gray-500 text-center">
        You can also type digits 2–9 on your keyboard
      </div>
    </div>

    <!-- Results -->
    <div class="bg-gray-800 rounded-xl p-4 overflow-y-auto" style="max-height:520px">
      <h2 class="font-semibold text-cyan-300 mb-3">Matching Words</h2>
      <div id="results" class="text-sm text-gray-200">
        <p class="text-gray-500 italic">Enter digits to find words…</p>
      </div>
    </div>
  </div>

  <!-- Example section -->
  <div class="mt-5 bg-gray-800 rounded-xl p-4">
    <h2 class="font-semibold text-cyan-300 mb-2">Try These Examples</h2>
    <div class="flex flex-wrap gap-2">
      <button onclick="loadExample('4663')" class="bg-gray-700 hover:bg-gray-600 rounded px-3 py-1 text-sm" aria-label="Try 4663">4663 (good/home/gone…)</button>
      <button onclick="loadExample('843')" class="bg-gray-700 hover:bg-gray-600 rounded px-3 py-1 text-sm" aria-label="Try 843">843 (the/vie/…)</button>
      <button onclick="loadExample('7664')" class="bg-gray-700 hover:bg-gray-600 rounded px-3 py-1 text-sm" aria-label="Try 7664">7664 (song/…)</button>
      <button onclick="loadExample('22737')" class="bg-gray-700 hover:bg-gray-600 rounded px-3 py-1 text-sm" aria-label="Try 22737">22737 (acres/…)</button>
      <button onclick="loadExample('3669')" class="bg-gray-700 hover:bg-gray-600 rounded px-3 py-1 text-sm" aria-label="Try 3669">3669 (enow/…)</button>
      <button onclick="loadExample('46368')" class="bg-gray-700 hover:bg-gray-600 rounded px-3 py-1 text-sm" aria-label="Try 46368">46368 (hotel/…)</button>
    </div>
  </div>
</div>

// Build T9 digit sequence for each word
function wordToDigits(word) {
  let result = '';
  for (const ch of word.toLowerCase()) {
    let found = false;
    for (const [digit, letters] of Object.entries(T9_MAP)) {
      if (letters.includes(ch)) { result += digit; found = true; break; }
    }
    if (!found) return null; // word has unmappable char
  }
  return result;
}

// Precompute: map from digit sequence to array of words
const digitToWords = {};
for (const word of WORD_LIST) {
  const digits = wordToDigits(word);
  if (!digits) continue;
  if (!digitToWords[digits]) digitToWords[digits] = [];
  if (!digitToWords[digits].includes(word)) digitToWords[digits].push(word);
}

let currentDigits = '';

function pressKey(d) {
  if (d === 0) return;
  if (currentDigits.length >= 7) return;
  currentDigits += String(d);
  update();
}

function backspace() {
  if (!currentDigits.length) return;
  currentDigits = currentDigits.slice(0,-1);
  update();
}

function clearAll() {
  currentDigits = '';
  update();
}

function loadExample(digits) {
  currentDigits = digits;
  update();
}

function update() {
  // Display digits
  const dispEl = document.getElementById('digitDisplay');
  dispEl.textContent = currentDigits || '';

  // Show letter combinations
  const letters = currentDigits.split('').map(d => T9_MAP[d] || '').join(' · ');
  document.getElementById('lettersDisplay').textContent = letters;

  if (!currentDigits) {
    document.getElementById('matchCount').textContent = '0';
    document.getElementById('results').innerHTML = '<p class="text-gray-500 italic">Enter digits to find words…</p>';
    return;
  }

  // Find matching words — only exact length match
  const matches = digitToWords[currentDigits] || [];

  document.getElementById('matchCount').textContent = matches.length;

  if (!matches.length) {
    document.getElementById('results').innerHTML = '<p class="text-gray-400 italic">No words found for this digit sequence.</p>';
    return;
  }

  // Group by length (should all be same length here, but keep consistent)
  const byLen = {};
  for (const w of matches) {
    const l = w.length;
    if (!byLen[l]) byLen[l] = [];
    byLen[l].push(w);
  }

  let html = '';
  for (const len of Object.keys(byLen).sort((a,b)=>a-b)) {
    const words = byLen[len];
    html += `<div class="mb-3">
      <div class="text-xs text-gray-500 uppercase tracking-wide mb-1">${escapeHtml(len)}-letter words (${words.length})</div>
      <div class="flex flex-wrap gap-2">
        ${words.map(w => `<span class="bg-cyan-900/60 text-cyan-200 rounded px-2 py-1 font-mono text-sm">${escapeHtml(w)}</span>`).join('')}
      </div>
    </div>`;
  }
  document.getElementById('results').innerHTML = html;
}

// Keyboard support
document.addEventListener('keydown', e => {
  const d = parseInt(e.key);
  if (d >= 2 && d <= 9) pressKey(d);
  else if (e.key === 'Backspace') backspace();
  else if (e.key === 'Delete' || e.key === 'Escape') clearAll();
});

// Init
update();
</script>
